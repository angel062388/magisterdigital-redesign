<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magister — Location page directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#D4AF37; --gold-dark:#A8842A; --gold-light:#E3C24E; --gold-deep:#6E561A;
    --ink:#16171A; --ink-deep:#0F1115; --bg-raised:#1C1D21;
    --muted:#45474C; --muted-2:#5E6066; --muted-on-dark:#868A90; --border:#C0C3C7;
    --paper:#F7F7F5; --paper-2:#F1F1EE; --paper-3:#EEEEEB;
    --rule:#2A2C31; --rule-light:#DFDFDA;
    --font-display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-body:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --container:1120px; --header-h:72px;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  #stage{min-height:100vh}
  a{color:inherit}
  img{max-width:100%;display:block}

  /* ==== SHARED PRIMITIVES (all three variants use these) =============== */
  .site-header{position:sticky;top:0;z-index:60;background:rgba(15,17,21,.72);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid rgba(255,255,255,.06)}
  .site-header .wrap{max-width:var(--container);margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:24px}
  .site-header .brand{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.01em}
  .site-header .brand em{font-style:italic;color:var(--gold)}
  .site-header nav{display:flex;gap:22px;font-size:14px;color:var(--muted-on-dark);margin-left:auto}
  .site-header nav a{text-decoration:none}
  .site-header .header-phone{color:var(--gold);text-decoration:underline;text-decoration-color:rgba(212,175,55,.4);text-underline-offset:4px;font-family:var(--font-mono);font-size:13px;letter-spacing:.03em}
  .site-header .header-phone:hover{text-decoration-color:var(--gold)}
  .site-header .header-cta{padding:9px 16px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;letter-spacing:.02em;text-transform:uppercase;transition:background 180ms var(--ease),transform 180ms var(--ease)}
  .site-header .header-cta:hover{background:var(--gold-light);transform:translateY(-1px)}
  .site-header .header-cta .ar{transition:transform 220ms var(--ease)}
  .site-header .header-cta:hover .ar{transform:translateX(3px)}
  @media (max-width:820px){.site-header nav{display:none} .site-header .header-phone{display:none}}

  .kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-on-dark)}
  .kicker em{font-style:normal;color:var(--gold)}

  .band{padding:96px 0}
  .band.light{background:var(--paper);color:var(--ink)}
  .band.light .kicker{color:var(--muted-2)}
  .band.light .kicker em{color:var(--gold-deep)}
  .wrap{max-width:var(--container);margin:0 auto;padding:0 24px}

  h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.02em;margin:0}
  h1 em, h2 em, h3 em{font-style:italic;color:var(--gold)}
  .band.light h1 em,.band.light h2 em,.band.light h3 em{color:var(--gold-deep)}
  h1{font-size:clamp(2rem,4.4vw,3.5rem);line-height:1.05;padding-bottom:.08em}
  h2{font-size:clamp(1.6rem,3vw,2.4rem);line-height:1.18;padding-bottom:.12em}
  h3{font-size:1.25rem;line-height:1.25;padding-bottom:.08em}
  .nowrap{white-space:nowrap}

  /* Homepage-parity CTA — .btn with .t label + .ar arrow that slides on hover, paired with .hero-tel */
  .btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;background:var(--gold);color:var(--ink);border:1px solid var(--gold);transition:background 180ms var(--ease),transform 180ms var(--ease),box-shadow 180ms var(--ease)}
  .btn .t{font-weight:600}
  .btn .ar{transition:transform 220ms var(--ease);display:inline-block}
  .btn:hover{background:var(--gold-light);transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,175,55,.28)}
  .btn:hover .ar{transform:translateX(4px)}
  .band.light .btn{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .band.light .btn:hover{background:#000}
  .btn-ghost{background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,.18)}
  .band.light .btn-ghost{color:var(--ink);border-color:#c9cbcf}
  .btn-ghost:hover{background:transparent;color:var(--gold);border-color:var(--gold);box-shadow:none;transform:translateY(-1px)}
  .band.light .btn-ghost:hover{color:var(--gold-deep);border-color:var(--gold-deep)}
  .btn-sm{padding:9px 16px;font-size:13px}
  .hero-tel{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:13px;color:var(--muted-on-dark);text-decoration:none;letter-spacing:.02em}
  .hero-tel .tag{color:var(--muted-on-dark);opacity:.7}
  .hero-tel b{color:var(--paper);font-weight:600;letter-spacing:.03em}
  .band.light .hero-tel{color:var(--muted-2)}
  .band.light .hero-tel b{color:var(--ink)}
  .tel{font-family:var(--font-mono);font-size:14px;color:var(--muted-on-dark);text-decoration:none}
  .band.light .tel{color:var(--muted-2)}

  /* Simple crumbs shared */
  .crumbs{font-family:var(--font-mono);font-size:12px;color:var(--muted-on-dark);letter-spacing:.08em;text-transform:uppercase;padding:14px 24px;max-width:var(--container);margin:0 auto}
  .crumbs a{text-decoration:none;color:inherit}
  .crumbs .sep{margin:0 8px;opacity:.4}
  .band.light .crumbs{color:var(--muted-2)}

  /* ==================================================================== */
  /* VARIANT 1 — CARTOGRAM                                                */
  /* Axis: the city is the hero. Neighborhood map, tinted zones per       */
  /* vertical, office pin, KPIs anchored to place.                        */
  /* ==================================================================== */
  .v1{background:radial-gradient(1200px 800px at 30% -10%,rgba(212,175,55,.06),transparent 60%),var(--ink)}
  .v1-hero{padding:56px 0 40px}
  .v1-hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
  @media (max-width:900px){.v1-hero .grid{grid-template-columns:1fr;gap:32px}}
  .v1-hero h1{font-size:clamp(2rem,4.2vw,3.3rem)}
  .v1-hero p.lede{color:var(--muted-on-dark);max-width:52ch;margin:20px 0 24px}
  .v1-hero .cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .v1-trust{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:36px;padding-top:24px;border-top:1px solid var(--rule)}
  .v1-trust .tcell{padding-right:16px}
  .v1-trust .tkey{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-on-dark)}
  .v1-trust .tval{font-family:var(--font-display);font-style:italic;font-size:1.15rem;color:var(--gold);margin-top:6px;line-height:1.1}
  @media (max-width:600px){.v1-trust{grid-template-columns:repeat(2,1fr);gap:16px 0}}

  /* Cartogram SVG */
  .cartogram{position:relative;aspect-ratio:5/4;border:1px solid var(--rule);border-radius:12px;background:linear-gradient(180deg,#101216,#0d0f13);overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .cartogram svg{width:100%;height:100%;display:block}
  .cartogram .legend{position:absolute;left:14px;bottom:14px;display:flex;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--muted-on-dark);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.06)}
  .cartogram .legend span{display:inline-flex;align-items:center;gap:6px}
  .cartogram .legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .cartogram .pin{position:absolute;left:22%;top:32%;transform:translate(-50%,-100%);text-align:center}
  .cartogram .pin .dot{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.18),0 0 24px 4px rgba(212,175,55,.35);margin:0 auto 6px;animation:pinPulse 2.4s ease-in-out infinite}
  .cartogram .pin .lbl{font-family:var(--font-mono);font-size:11px;color:#fff;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px;white-space:nowrap;border:1px solid rgba(212,175,55,.35)}
  @keyframes pinPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

  .v1-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:48px}
  .v1-stats .cell{padding:28px 24px;border-right:1px solid var(--rule)}
  .v1-stats .cell:last-child{border-right:none}
  .v1-stats .num{font-family:var(--font-display);font-size:2.6rem;font-style:italic;color:var(--gold);letter-spacing:-.02em;line-height:1}
  .v1-stats .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-on-dark);margin-top:10px}
  .v1-stats .cap{margin-top:8px;color:#c9c9c4;font-size:13px}
  @media (max-width:820px){.v1-stats{grid-template-columns:1fr}.v1-stats .cell{border-right:none;border-bottom:1px solid var(--rule)}.v1-stats .cell:last-child{border-bottom:none}}

  .v1-verts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px}
  @media (max-width:900px){.v1-verts{grid-template-columns:1fr}}
  .v1-vert{border:1px solid var(--rule);border-radius:12px;padding:28px;background:var(--bg-raised)}
  .v1-vert .tag{display:inline-block;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:14px}
  .v1-vert.home .tag{background:rgba(78,178,141,.12);color:#7BE0B0;border:1px solid rgba(78,178,141,.35)}
  .v1-vert.med  .tag{background:rgba(87,138,220,.12);color:#8FB0EA;border:1px solid rgba(87,138,220,.35)}
  .v1-vert.leg  .tag{background:rgba(212,175,55,.12);color:var(--gold-light);border:1px solid rgba(212,175,55,.35)}
  .v1-vert h3{margin-bottom:10px}
  .v1-vert p{color:#c9c9c4;margin:0 0 14px}
  .v1-vert ul{margin:0;padding-left:18px;color:var(--muted-on-dark);font-size:14px}
  .v1-vert ul li{margin:4px 0}

  .v1-office{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;padding:32px;border:1px solid var(--rule);border-radius:12px;background:linear-gradient(180deg,rgba(212,175,55,.04),transparent),var(--bg-raised);margin-top:24px}
  @media (max-width:820px){.v1-office{grid-template-columns:1fr}}
  .v1-office .addr{font-family:var(--font-display);font-size:1.6rem;line-height:1.15}
  .v1-office .meta{color:var(--muted-on-dark);margin-top:8px;font-size:14px}
  .v1-office .actions{display:flex;flex-direction:column;gap:10px;justify-content:center}

  /* Section head shared with homepage rhythm */
  .v1 .sec-head{margin-bottom:32px}
  .v1 .sec-head .kicker{margin-bottom:12px}
  .v1 .sec-head h2{max-width:26ch}

  /* V1 SERVICES — VERBATIM PORT of homepage .svc-list (image + body + arrow, alternating) */
  .v1-services{background:var(--paper);color:var(--ink)}
  .v1-services .kicker{color:var(--muted-2)}
  .v1-services .kicker em{color:var(--gold-deep)}
  .v1-services h2{max-width:22ch}
  .v1-services h2 em{color:var(--gold-deep)}
  .v1-svc-list{list-style:none;margin:32px 0 0;padding:0;border-top:1px solid var(--rule-light)}
  .v1-svc{border-bottom:1px solid var(--rule-light);position:relative}
  .v1-svc-link{display:grid;grid-template-columns:1fr;gap:24px;padding:32px 0;text-decoration:none;color:inherit;cursor:pointer}
  .v1-svc-visual{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--bg-raised);border-radius:8px}
  .v1-svc-visual img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.65) contrast(1.1);transition:filter 380ms var(--ease),transform 500ms var(--ease)}
  .v1-svc-link:hover .v1-svc-visual img{filter:grayscale(.4) brightness(.85) contrast(1.05);transform:scale(1.03)}
  .v1-svc-visual::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(15,17,21,.35) 100%);pointer-events:none}
  .v1-svc-idx{position:absolute;top:12px;left:12px;z-index:2;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--ink);background:var(--paper);padding:4px 8px;border-radius:4px}
  .v1-svc-body{padding-right:16px}
  .v1-svc-name{display:inline-block;font-family:var(--font-display);font-style:italic;font-weight:600;font-size:2rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none;position:relative;padding-top:6px;transition:color 220ms var(--ease)}
  .v1-svc-name::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--gold-deep);transform:scaleX(0);transform-origin:left;transition:transform 320ms var(--ease)}
  .v1-svc-link:hover .v1-svc-name{color:var(--gold-deep)}
  .v1-svc-link:hover .v1-svc-name::after{transform:scaleX(1)}
  .v1-svc-outcome{display:block;margin-top:16px;color:var(--muted);font-size:15px;line-height:1.55;max-width:52ch}
  .v1-svc-actions{margin-top:24px}
  .v1-svc-arrow{font-family:var(--font-mono);font-size:22px;color:var(--muted-2);transition:transform 260ms var(--ease),color 220ms var(--ease);align-self:center;text-align:right}
  .v1-svc-link:hover .v1-svc-arrow{color:var(--gold-deep);transform:translateX(6px)}
  @media (min-width:820px){
    .v1-svc-link{grid-template-columns:.9fr 1.1fr 44px;gap:48px;padding:40px 0 40px 16px;align-items:center}
    .v1-svc:nth-child(even) .v1-svc-visual{order:2}
    .v1-svc:nth-child(even) .v1-svc-body{order:1;padding-left:0;padding-right:16px}
    .v1-svc:nth-child(even) .v1-svc-arrow{order:3}
  }

  /* V1 INDUSTRIES (dark, image-card panels mirroring homepage .panels) */
  .v1-industries{background:var(--ink)}
  .v1-industries .kicker em{color:var(--gold)}
  .v1-industries h2 em{color:var(--gold)}
  .v1-panels{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
  @media (max-width:900px){.v1-panels{grid-template-columns:1fr}}
  .v1-panel{position:relative;aspect-ratio:5/7;border-radius:12px;overflow:hidden;background:#0d0f13;box-shadow:0 12px 32px rgba(0,0,0,.35)}
  .v1-panel img{width:100%;height:100%;object-fit:cover;filter:grayscale(.8) brightness(.55) contrast(1.05);transition:filter 320ms var(--ease),transform 500ms var(--ease)}
  .v1-panel:hover img{filter:grayscale(.4) brightness(.7) contrast(1.05);transform:scale(1.03)}
  .v1-panel .pin{position:absolute;left:0;right:0;bottom:0;padding:24px;background:linear-gradient(180deg,transparent 0%,rgba(15,17,21,.4) 50%,rgba(15,17,21,.92) 100%)}
  .v1-panel .pin .kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:block}
  .v1-panel .pin h3{font-family:var(--font-display);font-size:1.35rem;line-height:1.15;color:#fff;margin:0 0 12px;font-weight:500}
  .v1-panel .pin p{color:var(--muted-on-dark);font-size:13px;margin:0 0 12px;line-height:1.5;opacity:0;max-height:0;transition:opacity 260ms var(--ease),max-height 320ms var(--ease)}
  .v1-panel:hover .pin p{opacity:1;max-height:120px}
  .v1-panel .vert-link{color:var(--gold);font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--gold-dark);padding-bottom:2px;display:inline-flex;align-items:center;gap:6px;opacity:0;transform:translateY(4px);transition:opacity 260ms var(--ease),transform 260ms var(--ease)}
  .v1-panel:hover .vert-link{opacity:1;transform:translateY(0)}

  /* V1 CASE STUDIES (light band, mirrors homepage .cs-grid + .cs-card) */
  .v1-cases{background:var(--paper);color:var(--ink)}
  .v1-cases .kicker{color:var(--muted-2)}
  .v1-cases .kicker em{color:var(--gold-deep)}
  .v1-cases h2 em{color:var(--gold-deep)}
  .v1-cs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px}
  @media (max-width:900px){.v1-cs-grid{grid-template-columns:1fr}}
  .v1-cs-card{display:flex;flex-direction:column;height:100%;background:#fff;border:1px solid var(--rule-light);border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.04);transition:transform 260ms var(--ease),box-shadow 260ms var(--ease)}
  .v1-cs-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.10)}
  .v1-cs-thumb{aspect-ratio:16/10;overflow:hidden;background:#0d0f13}
  .v1-cs-thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.55) contrast(1.15);transition:filter 320ms var(--ease),transform 500ms var(--ease)}
  .v1-cs-card:hover .v1-cs-thumb img{filter:grayscale(.6) brightness(.72) contrast(1.1);transform:scale(1.03)}
  .v1-cs-body{padding:22px;display:flex;flex-direction:column;gap:12px;flex:1}
  .v1-cs-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep)}
  .v1-cs-headline{font-family:var(--font-display);font-size:1.15rem;line-height:1.3;color:var(--ink);font-weight:500}
  .v1-cs-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .v1-cs-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#F1F1EE;color:var(--muted);border:1px solid var(--rule-light)}
  .v1-cs-cta{margin-top:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);text-decoration:none;padding-top:12px;border-top:1px solid var(--rule-light);display:inline-flex;align-items:center;gap:6px;transition:gap 220ms var(--ease)}
  .v1-cs-cta:hover{gap:12px}

  /* V1 closing CTA band */
  .v1-close{background:linear-gradient(180deg,var(--ink),var(--ink-deep));padding:96px 0;text-align:center;border-top:1px solid var(--rule)}
  .v1-close h2{margin:14px auto 24px;max-width:22ch}
  .v1-close .actions{display:inline-flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}

  /* ==================================================================== */
  /* VARIANT 2 — MARKET BRIEF                                             */
  /* Axis: no imagery. Reads like a Bloomberg city profile. Long          */
  /* Playfair sentences, hairline dividers, mono kickers, footnotes.      */
  /* ==================================================================== */
  .v2{background:var(--paper);color:var(--ink)}
  .v2 .site-header{background:rgba(247,247,245,.86);border-bottom:1px solid var(--rule-light);color:var(--ink)}
  .v2 .site-header nav{color:var(--muted-2)}
  .v2 .site-header .call{border-color:var(--gold-deep);color:var(--gold-deep)}
  .v2 .crumbs{color:var(--muted-2)}

  .v2-hero{padding:64px 0 24px;border-bottom:1px solid var(--rule-light)}
  .v2-hero .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;color:var(--muted-2);font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .v2-hero .top em{font-style:normal;color:var(--gold-deep)}
  .v2-hero h1{font-size:clamp(2.4rem,5.2vw,4.2rem);line-height:1.02;letter-spacing:-.025em;margin-top:24px;max-width:22ch}
  .v2-hero h1 em{color:var(--gold-deep)}
  .v2-hero .subtitle{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:1.5rem;color:var(--muted);margin-top:24px;max-width:44ch;line-height:1.35}
  .v2-hero .meta{display:flex;gap:32px;margin-top:36px;padding-top:20px;border-top:1px solid var(--rule-light);flex-wrap:wrap}
  .v2-hero .meta div{font-size:13px;color:var(--muted-2)}

            <div class="addr"><em class="neigh">Office &middot; ${C.neighborhood}</em>${C.address}<br>${C.cityState}</div>
          </div>
          <div class="team">
            <div class="avs">${C.founders.map(f=>`<div class="av">${f.i}</div>`).join('')}</div>
            <div>Founders on the account, not layered under an AM. Brian, Michael and Dimitry.</div>
          </div>
          <div>
            <a class="btn btn-primary" href="#">Book the call</a>
          </div>
        </div>
      </div>
    </section>

    <section class="v3-cta">
      <div class="wrap">
        <div class="kicker"><em>03 /</em> &nbsp; Next step</div>
        <h2>Bring us your account, <em>we will find the leaks</em></h2>
        <div class="price">Retainer <b>${C.price}</b> &nbsp;&middot;&nbsp; ${C.term} &nbsp;&middot;&nbsp; ${C.address}, ${C.cityState}</div>
        <div class="actions">
          <a class="btn btn-primary" href="#">Book a 45-minute call</a>
          <a class="tel" href="${C.telHref}">${C.phone}</a>
        </div>
      </div>
    </section>
  </div>
  `;
}

/* ==================================================================== */
/* Picker wiring — verbatim from PICKER.md                              */
/* ==================================================================== */
const variants = [variant1, variant2, variant3];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight(){
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i){
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); window.scrollTo(0,0); });
}
function setActive(i){
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el,j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current','true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null,'',url);
  mount(i);
}
items.forEach((el,i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'),10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready','')));
</script>
