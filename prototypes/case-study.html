<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prototype: case study page, 3 directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   MAGISTER TOKENS — copied verbatim from mockup/tokens.css so this file
   is standalone. Do not diverge from the live values.
   ============================================================================ */
:root{
  --gold:#D4AF37; --gold-dark:#A8842A; --gold-light:#E3C24E; --gold-deep:#6E561A;
  --ink:#16171A; --ink-deep:#0F1115;
  --muted:#45474C; --muted-2:#5E6066; --muted-on-dark:#868A90; --border:#C0C3C7;
  --paper:#F7F7F5; --paper-2:#F1F1EE; --paper-3:#EEEEEB;
  --bg:var(--ink); --bg-raised:#1C1D21; --surface-light:var(--paper);
  --text-on-dark:var(--paper); --text-on-light:var(--ink);
  --text-muted-dark:var(--border); --text-muted-light:var(--muted);
  --accent-on-dark:var(--gold); --accent-on-light:var(--gold-deep);
  --rule:#2A2C31; --rule-light:#DFDFDA;

  --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-body:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;

  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-5:1.5rem;
  --sp-6:2rem; --sp-7:3rem; --sp-8:4rem; --sp-9:6rem; --sp-10:8rem;
  --r-sm:2px; --r-md:4px; --r-lg:8px; --r-full:999px;
  --ease:cubic-bezier(.4,0,.2,1);
  --dur:160ms;
  --container:1120px; --header-h:72px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{margin:0; background:var(--paper); color:var(--text-on-light);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden}

.wrap{max-width:var(--container); margin:0 auto; padding:0 var(--sp-6)}

/* ============================================================================
   SHARED CONTEXT — sticky header that stays visible in every variant so
   the prototype reads as a real page, not a floating design.
   ============================================================================ */
.site-header{position:sticky; top:0; z-index:50; height:var(--header-h);
  display:flex; align-items:center; background:rgba(22,23,26,.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--rule)}
.site-header .wrap{display:flex; align-items:center; gap:var(--sp-6); width:100%}
.brand{font-family:var(--font-display); font-weight:700; font-size:1.05rem;
  letter-spacing:-.01em; color:var(--paper); text-decoration:none; flex:0 0 auto}
.brand span{color:var(--gold)}
.site-crumb{font-family:var(--font-mono); font-size:.6875rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted-on-dark); flex:1; margin-left:var(--sp-5)}
.site-crumb a{color:var(--muted-on-dark); text-decoration:none}
.site-crumb a:hover{color:var(--paper)}
.site-crumb .sep{margin:0 var(--sp-3); opacity:.5}
.site-crumb .here{color:var(--paper)}
.header-cta{display:inline-flex; align-items:center; font-family:var(--font-mono);
  font-size:.75rem; letter-spacing:.13em; text-transform:uppercase; padding:9px 16px;
  border-radius:var(--r-md); border:2px solid var(--gold-dark);
  background:var(--gold); color:var(--ink); text-decoration:none; flex:0 0 auto;
  transition:background var(--dur) var(--ease), transform var(--dur) var(--ease)}
.header-cta:hover{background:var(--gold-light); transform:translateY(-1px)}

/* ============================================================================
   SHARED PRIMITIVES — small utilities every variant borrows.
   ============================================================================ */
.mono{font-family:var(--font-mono)}
.eyebrow{font-family:var(--font-mono); font-size:.6875rem; letter-spacing:.18em;
  text-transform:uppercase}
.rule-gold{width:64px; height:2px; background:var(--gold-deep); border:0; margin:0}
.rule-thin{width:100%; height:1px; background:var(--rule-light); border:0; margin:0}
.up{color:#0F6E3C} /* green delta */
.dn{color:#B01B1B} /* red delta */

/* ============================================================================
   STAGE — every variant paints into #stage. It fills below the header.
   ============================================================================ */
#stage{min-height:calc(100vh - var(--header-h))}

/* ============================================================================
   VARIANT 1 — EDITORIAL
   Axis: narrative-forward. Long-form flow, numbers embedded in prose,
   generous whitespace. Reads like a business magazine feature.
   ============================================================================ */
.v-editorial{background:var(--paper); color:var(--text-on-light)}
.v-editorial .ed-hero{padding:var(--sp-10) 0 var(--sp-9)}
.v-editorial .ed-hero .wrap{max-width:820px}
.v-editorial .ed-eyebrow{font-family:var(--font-mono); font-size:.75rem;
  letter-spacing:.24em; text-transform:uppercase; color:var(--gold-deep);
  margin:0 0 var(--sp-5); display:flex; align-items:center; gap:var(--sp-3);
  flex-wrap:wrap}
.v-editorial .ed-eyebrow .dot{color:var(--muted-2)}
.v-editorial .ed-hero h1{font-family:var(--font-display); font-weight:600;
  font-style:italic; font-size:clamp(2.4rem, 4.6vw, 3.8rem); line-height:1.08;
  letter-spacing:-.015em; margin:0 0 var(--sp-8); color:var(--ink);
  text-wrap:balance}
.v-editorial .ed-hero h1 em{font-style:normal; color:var(--gold-deep)}
.v-editorial .ed-footnote{display:flex; gap:var(--sp-7); flex-wrap:wrap;
  padding-top:var(--sp-6); border-top:1px solid var(--rule-light)}
.v-editorial .ed-footnote .fn{flex:1 1 220px; min-width:200px}
.v-editorial .ed-footnote .fn-num{font-family:var(--font-display); font-weight:700;
  font-size:2rem; color:var(--gold-deep); line-height:1; margin:0 0 var(--sp-2)}
.v-editorial .ed-footnote .fn-lbl{font-family:var(--font-mono); font-size:.6875rem;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0}

.v-editorial .ed-sec{padding:var(--sp-9) 0}
.v-editorial .ed-sec.alt{background:var(--paper-2)}
.v-editorial .ed-sec .wrap{max-width:680px}
.v-editorial .ed-sec .num-eyebrow{font-family:var(--font-mono); font-size:.6875rem;
  letter-spacing:.24em; text-transform:uppercase; color:var(--muted-2);
  margin:0 0 var(--sp-4)}
.v-editorial .ed-sec .num-eyebrow b{color:var(--gold-deep); font-weight:600}
.v-editorial .ed-sec h2{font-family:var(--font-display); font-weight:700;
  font-size:clamp(1.8rem, 3.4vw, 2.6rem); line-height:1.1;
  margin:0 0 var(--sp-6); color:var(--ink); text-wrap:balance}
.v-editorial .ed-sec p{max-width:62ch; margin:0 0 var(--sp-5); font-size:1.0625rem;
  line-height:1.7; color:var(--ink)}
.v-editorial .ed-sec p:last-child{margin-bottom:0}
.v-editorial .ed-sec .lift{font-family:var(--font-mono); font-weight:600;
  color:var(--gold-deep); font-size:.95em; letter-spacing:.01em}

.v-editorial .ed-diagnosis{display:grid; grid-template-columns:1fr 1fr;
  gap:var(--sp-8); margin-top:var(--sp-6)}
@media (max-width:800px){.v-editorial .ed-diagnosis{grid-template-columns:1fr}}
.v-editorial .ed-diagnosis .col h3{font-family:var(--font-display); font-style:italic;
  font-weight:600; font-size:1.35rem; margin:0 0 var(--sp-4); color:var(--muted)}
.v-editorial .ed-diagnosis .col:nth-child(2) h3{color:var(--gold-deep)}
.v-editorial .ed-diagnosis ul{list-style:none; padding:0; margin:0}
.v-editorial .ed-diagnosis li{padding:var(--sp-4) 0; border-bottom:1px solid var(--rule-light);
  font-size:1rem; line-height:1.55; color:var(--ink)}
.v-editorial .ed-diagnosis li:last-child{border-bottom:0}

.v-editorial .ed-chain{margin-top:var(--sp-6)}
.v-editorial .ed-chain .row{display:grid; grid-template-columns:180px 1fr;
  gap:var(--sp-6); padding:var(--sp-5) 0; border-bottom:1px solid var(--rule-light);
  align-items:baseline}
.v-editorial .ed-chain .row:last-child{border-bottom:0}
.v-editorial .ed-chain .row .metric{font-family:var(--font-mono); font-weight:500;
  font-size:.8125rem; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
.v-editorial .ed-chain .row .val{font-family:var(--font-display); font-size:1.15rem;
  color:var(--ink); font-weight:600}
.v-editorial .ed-chain .row .val .delta{font-family:var(--font-mono); font-size:.85em;
  margin-left:var(--sp-3); font-weight:500}
.v-editorial .ed-chain .row .val .base{font-family:var(--font-mono); font-size:.8em;
  color:var(--muted-2); margin-left:var(--sp-3); font-weight:400}

.v-editorial .ed-markets .m{padding:var(--sp-6) 0; border-bottom:1px solid var(--rule-light)}
.v-editorial .ed-markets .m:last-child{border-bottom:0}
.v-editorial .ed-markets .m h4{font-family:var(--font-display); font-weight:600;
  font-style:italic; font-size:1.4rem; margin:0 0 var(--sp-3); color:var(--ink)}
.v-editorial .ed-markets .m p{margin:0; font-size:1rem; line-height:1.65}
.v-editorial .ed-markets .m p .fig{font-family:var(--font-mono); font-weight:600;
  color:var(--gold-deep)}

.v-editorial .ed-more{padding:var(--sp-9) 0; text-align:center; color:var(--muted-2);
  font-family:var(--font-mono); font-size:.75rem; letter-spacing:.2em;
  text-transform:uppercase; background:var(--paper-3)}
.v-editorial .ed-more span{display:inline-block; padding:var(--sp-3) var(--sp-5);
  border:1px dashed var(--rule-light); border-radius:var(--r-full)}

/* ============================================================================
   VARIANT 2 — DASHBOARD
   Axis: grid-forward. Metrics dominate, prose is minimal chapter intro.
   Reads like an executive audit briefing.
   ============================================================================ */
.v-dashboard{background:var(--ink); color:var(--text-on-dark)}
.v-dashboard .db-hero{padding:var(--sp-9) 0 var(--sp-8);
  background:linear-gradient(180deg, var(--ink-deep) 0%, var(--ink) 100%);
  border-bottom:1px solid var(--rule)}
.v-dashboard .db-hero .wrap{max-width:1120px}
.v-dashboard .db-eyebrow{font-family:var(--font-mono); font-size:.6875rem;
  letter-spacing:.24em; text-transform:uppercase; color:var(--gold);
  margin:0 0 var(--sp-5); display:flex; align-items:center; gap:var(--sp-3);
  flex-wrap:wrap}
.v-dashboard .db-eyebrow .dot{color:var(--muted-on-dark)}
.v-dashboard .db-kpigrid{display:grid; grid-template-columns:repeat(3,1fr);
  gap:var(--sp-4); margin:0 0 var(--sp-7)}
@media (max-width:900px){.v-dashboard .db-kpigrid{grid-template-columns:1fr}}
.v-dashboard .db-kpi{background:var(--bg-raised); border:1px solid var(--rule);
  border-radius:var(--r-lg); padding:var(--sp-6);
  display:flex; flex-direction:column; gap:var(--sp-3)}
.v-dashboard .db-kpi .lbl{font-family:var(--font-mono); font-size:.6875rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted-on-dark); margin:0}
.v-dashboard .db-kpi .num{font-family:var(--font-mono); font-weight:600;
  font-size:clamp(2.4rem, 4.6vw, 3.6rem); line-height:1; color:var(--gold); margin:0;
  letter-spacing:-.02em}
.v-dashboard .db-kpi .sub{font-family:var(--font-body); font-size:.875rem;
  color:var(--text-muted-dark); margin:0; line-height:1.4}
.v-dashboard .db-hero h1{font-family:var(--font-display); font-weight:700;
  font-size:clamp(1.6rem, 3.2vw, 2.441rem); line-height:1.15; margin:0;
  max-width:44ch; text-wrap:balance; color:var(--paper)}
.v-dashboard .db-hero h1 em{font-style:italic; color:var(--gold)}

.v-dashboard .db-sec{padding:var(--sp-8) 0}
.v-dashboard .db-sec.alt{background:var(--bg-raised)}
.v-dashboard .db-sec .wrap{max-width:1120px}
.v-dashboard .db-head{display:flex; align-items:baseline; gap:var(--sp-5);
  margin-bottom:var(--sp-6); padding-bottom:var(--sp-4); border-bottom:1px solid var(--rule)}
.v-dashboard .db-head .num{font-family:var(--font-mono); font-size:.75rem;
  letter-spacing:.18em; color:var(--gold); font-weight:600; flex:0 0 auto}
.v-dashboard .db-head h2{font-family:var(--font-display); font-weight:700;
  font-size:clamp(1.4rem, 2.4vw, 1.85rem); margin:0; color:var(--paper);
  letter-spacing:-.01em}
.v-dashboard .db-head .lede{font-family:var(--font-body); font-size:.9375rem;
  color:var(--text-muted-dark); margin-left:auto; max-width:38ch; line-height:1.5}
@media (max-width:900px){.v-dashboard .db-head{flex-wrap:wrap}
  .v-dashboard .db-head .lede{margin-left:0; max-width:none}}

.v-dashboard .db-2col{display:grid; grid-template-columns:2fr 1fr;
  gap:var(--sp-6); align-items:start}
@media (max-width:900px){.v-dashboard .db-2col{grid-template-columns:1fr}}
.v-dashboard .db-2col p{margin:0 0 var(--sp-4); font-size:1rem;
  line-height:1.65; color:var(--paper); max-width:64ch}
.v-dashboard .db-2col p:last-child{margin-bottom:0}
.v-dashboard .db-spec{background:var(--ink-deep); border:1px solid var(--rule);
  border-radius:var(--r-md); padding:var(--sp-5)}
.v-dashboard .db-spec dt{font-family:var(--font-mono); font-size:.6875rem;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted-on-dark);
  margin:0 0 var(--sp-2)}
.v-dashboard .db-spec dd{font-family:var(--font-mono); font-weight:500;
  font-size:1rem; color:var(--gold); margin:0 0 var(--sp-4)}
.v-dashboard .db-spec dd:last-child{margin-bottom:0}

.v-dashboard .db-tables{display:grid; grid-template-columns:1fr 1fr;
  gap:var(--sp-5)}
@media (max-width:900px){.v-dashboard .db-tables{grid-template-columns:1fr}}
.v-dashboard .db-tbl{background:var(--ink-deep); border:1px solid var(--rule);
  border-radius:var(--r-md); overflow:hidden}
.v-dashboard .db-tbl-head{padding:var(--sp-3) var(--sp-4); background:#22242A;
  border-bottom:1px solid var(--rule); font-family:var(--font-mono);
  font-size:.6875rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold)}
.v-dashboard .db-tbl ul{list-style:none; margin:0; padding:0}
.v-dashboard .db-tbl li{padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--rule);
  font-size:.9375rem; color:var(--paper); line-height:1.5}
.v-dashboard .db-tbl li:last-child{border-bottom:0}
.v-dashboard .db-tbl li:nth-child(even){background:rgba(255,255,255,.02)}

.v-dashboard .db-mgrid{display:grid; grid-template-columns:repeat(3,1fr);
  gap:var(--sp-3); grid-auto-rows:1fr}
@media (max-width:1000px){.v-dashboard .db-mgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.v-dashboard .db-mgrid{grid-template-columns:1fr}}
.v-dashboard .db-mcard{background:var(--ink-deep); border:1px solid var(--rule);
  border-radius:var(--r-md); padding:var(--sp-4);
  display:flex; flex-direction:column; gap:var(--sp-2)}
.v-dashboard .db-mcard .grp{font-family:var(--font-mono); font-size:.625rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin:0}
.v-dashboard .db-mcard .name{font-family:var(--font-body); font-size:.875rem;
  color:var(--text-muted-dark); margin:0}
.v-dashboard .db-mcard .val{font-family:var(--font-mono); font-weight:600;
  font-size:2rem; color:var(--paper); margin:0; line-height:1; letter-spacing:-.02em}
.v-dashboard .db-mcard .from{font-family:var(--font-mono); font-size:.75rem;
  color:var(--muted-on-dark); margin:0}
.v-dashboard .db-mcard .delta{font-family:var(--font-mono); font-size:.8125rem;
  font-weight:500}

.v-dashboard .db-metrogrid{display:grid; grid-template-columns:repeat(4,1fr);
  gap:var(--sp-4)}
@media (max-width:1000px){.v-dashboard .db-metrogrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.v-dashboard .db-metrogrid{grid-template-columns:1fr}}
.v-dashboard .db-metro{background:var(--ink-deep); border:1px solid var(--rule);
  border-radius:var(--r-md); padding:var(--sp-5)}
.v-dashboard .db-metro h4{font-family:var(--font-display); font-weight:600;
  font-size:1.15rem; margin:0 0 var(--sp-4); color:var(--gold); letter-spacing:-.01em}
.v-dashboard .db-metro .row{display:flex; justify-content:space-between;
  align-items:baseline; padding:var(--sp-3) 0; border-bottom:1px solid var(--rule);
  font-family:var(--font-mono); font-size:.875rem}
.v-dashboard .db-metro .row:last-child{border-bottom:0}
.v-dashboard .db-metro .row .k{color:var(--muted-on-dark)}
.v-dashboard .db-metro .row .v{color:var(--paper); font-weight:600}

.v-dashboard .db-more{padding:var(--sp-8) 0; text-align:center;
  background:var(--ink-deep); border-top:1px solid var(--rule);
  color:var(--muted-on-dark); font-family:var(--font-mono); font-size:.75rem;
  letter-spacing:.2em; text-transform:uppercase}
.v-dashboard .db-more span{display:inline-block; padding:var(--sp-3) var(--sp-5);
  border:1px dashed var(--rule)}

/* ============================================================================
   VARIANT 3 — LEDGER
   Axis: audit-trail scroll. Persistent left gutter with numbered entries.
   Each section is a ledger row that builds on the prior. Reads like watching
   an audit reconcile in real time.
   ============================================================================ */
.v-ledger{background:var(--paper); color:var(--text-on-light)}
.v-ledger .lg-hero{padding:var(--sp-8) 0 var(--sp-8);
  border-bottom:1px solid var(--rule-light)}
.v-ledger .lg-hero .wrap{display:grid; grid-template-columns:120px 1fr;
  gap:var(--sp-6); max-width:1120px}
@media (max-width:800px){.v-ledger .lg-hero .wrap{grid-template-columns:80px 1fr; gap:var(--sp-4)}}
.v-ledger .lg-gutter{position:relative}
.v-ledger .lg-gnum{font-family:var(--font-mono); font-weight:600; font-size:.75rem;
  letter-spacing:.18em; color:var(--gold-deep); margin:0}
.v-ledger .lg-glabel{font-family:var(--font-mono); font-size:.6875rem;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2); margin:var(--sp-2) 0 0}
.v-ledger .lg-hero .lg-eyebrow{font-family:var(--font-mono); font-size:.75rem;
  letter-spacing:.22em; text-transform:uppercase; color:var(--gold-deep);
  margin:0 0 var(--sp-5); display:flex; gap:var(--sp-3); flex-wrap:wrap}
.v-ledger .lg-hero .lg-eyebrow .dot{color:var(--muted-2)}
.v-ledger .lg-hero h1{font-family:var(--font-display); font-weight:700;
  font-size:clamp(1.8rem, 3.4vw, 2.6rem); line-height:1.15;
  margin:0 0 var(--sp-7); color:var(--ink); max-width:26ch; text-wrap:balance;
  letter-spacing:-.015em}
.v-ledger .lg-hero h1 em{font-style:italic; color:var(--gold-deep)}
.v-ledger .lg-ledger-rows{display:flex; flex-direction:column;
  border-top:2px solid var(--gold-deep); border-bottom:1px solid var(--rule-light)}
.v-ledger .lg-lrow{display:grid; grid-template-columns:60px 1fr 220px;
  gap:var(--sp-5); align-items:baseline; padding:var(--sp-4) 0;
  border-bottom:1px solid var(--rule-light)}
.v-ledger .lg-lrow:last-child{border-bottom:0}
@media (max-width:800px){.v-ledger .lg-lrow{grid-template-columns:40px 1fr 1fr; gap:var(--sp-3)}}
.v-ledger .lg-lrow .idx{font-family:var(--font-mono); font-size:.75rem; color:var(--muted-2)}
.v-ledger .lg-lrow .desc{font-family:var(--font-body); font-size:1rem; color:var(--ink);
  line-height:1.5}
.v-ledger .lg-lrow .val{font-family:var(--font-mono); font-weight:600; font-size:1.25rem;
  color:var(--gold-deep); text-align:right; line-height:1}
.v-ledger .lg-lrow .val small{font-family:var(--font-mono); font-weight:400;
  font-size:.7rem; color:var(--muted-2); display:block; margin-top:var(--sp-1);
  letter-spacing:.06em}

.v-ledger .lg-sec{padding:var(--sp-9) 0; border-bottom:1px solid var(--rule-light)}
.v-ledger .lg-sec .wrap{display:grid; grid-template-columns:120px 1fr;
  gap:var(--sp-6); max-width:1120px; align-items:start}
@media (max-width:800px){.v-ledger .lg-sec .wrap{grid-template-columns:80px 1fr; gap:var(--sp-4)}}
.v-ledger .lg-sec h2{font-family:var(--font-display); font-weight:700;
  font-size:clamp(1.5rem, 2.8vw, 2rem); line-height:1.15; margin:0 0 var(--sp-5);
  color:var(--ink); letter-spacing:-.01em; max-width:26ch}
.v-ledger .lg-sec p{max-width:60ch; margin:0 0 var(--sp-4); font-size:1rem;

/* ============================================================================
   PICKER WIRING — from PICKER.md verbatim (no replay button since sections
   are static; number keys 1–3 and arrows switch instantly).
   ============================================================================ */
const variants = [renderEditorial, renderDashboard, renderLedger];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;

function moveHighlight(){
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i){
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); window.scrollTo(0,0); });
}
function setActive(i){
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
});
// When URL has ?v=N, hide the picker chrome and show the simple bottom nav instead.
// The base URL (no ?v=) still gets the full picker for direct comparison.
const urlV = new URLSearchParams(location.search).get('v');
if (urlV) {
  picker.style.display = 'none';
  const dnav = document.querySelector('.direct-nav');
  dnav.style.display = 'flex';
  const currentA = dnav.querySelector(`a[data-v="${urlV}"]`);
  if (currentA) currentA.setAttribute('aria-current', 'true');
}
setActive((parseInt(urlV, 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
