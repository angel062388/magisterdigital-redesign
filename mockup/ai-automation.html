<style>
  /* Page-scoped styles (aa- prefix prevents bleed to homepage) */
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--ink,#0F1115); color:var(--paper,#F7F7F5);
    font-family:var(--font-sans,'Inter',system-ui,-apple-system,sans-serif);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; line-height:1.5}
  ::selection{background:var(--gold,#D4AF37); color:var(--ink,#0F1115)}
  a{color:inherit; text-decoration:none}

  /* SYSTEM BAR */
  .aa-sysbar{display:flex; align-items:center; gap:16px; padding:14px 32px;
    border-bottom:1px solid var(--border,#2A2C31); font-family:var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace);
    font-size:.72rem; color:var(--muted-on-dark,#868A90); letter-spacing:.04em}
  .aa-sysbar .dot{width:8px; height:8px; border-radius:50%; background:#3FB984;
    box-shadow:0 0 0 4px rgba(63,185,132,.14)}
  .aa-sysbar .path{color:var(--paper,#F7F7F5)}
  .aa-sysbar .path .accent{color:var(--gold,#D4AF37)}
  .aa-sysbar .sep{opacity:.35}
  .aa-sysbar .right{margin-left:auto; display:flex; gap:16px}

  /* SITE HEADER */
  .aa-hdr{display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--border,#2A2C31)}
  .aa-brand{display:flex; align-items:center; gap:10px; font-family:var(--font-serif,'Playfair Display',Georgia,serif);
    font-size:1.15rem; font-weight:600; letter-spacing:.02em; color:var(--paper,#F7F7F5)}
  .aa-brand::before{content:""; width:22px; height:22px; background:var(--gold,#D4AF37);
    mask:radial-gradient(circle at center,transparent 25%,#000 26%); border-radius:3px}
  .aa-nav{display:flex; gap:22px; font-family:var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace);
    font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted-on-dark,#868A90)}
  .aa-nav a.active{color:var(--gold,#D4AF37)}
  .aa-cta{display:inline-flex; align-items:center; gap:10px; padding:10px 16px;
    background:var(--gold,#D4AF37); color:var(--ink,#0F1115); font-family:var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace);
    font-weight:600; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    border-radius:4px; border:1px solid var(--gold-dark,#A8842A)}

  /* FOOTER (minimal, matches homepage tone) */
  .aa-footer{padding:48px 32px 32px; border-top:1px solid var(--border,#2A2C31);
    font-family:var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace);
    font-size:.72rem; color:var(--muted-on-dark,#868A90);
    display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center}
  .aa-footer .r{text-align:right}
  .aa-footer b{color:var(--paper,#F7F7F5); font-weight:600}
</style>
</head>
